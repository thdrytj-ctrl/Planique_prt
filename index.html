<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Planique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='%232e5e4e'/%3E%3Crect x='3' y='5' width='26' height='7' rx='4' fill='%23234a3d'/%3E%3Cpath d='M10 20.5l4 4 8-9' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<!-- PWA: 홈 화면에 앱으로 설치 -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Planique" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#24221e; --mute:#7b776e; --faint:#a6a299;
  --line:#e4e1d9; --line2:#cfcbc1; --head:#f0eee8; --ro:#f9f8f5;
  --acc:#2e5e4e; --acc-w:#e4ede8; --red:#b3402e; --red-w:#f7e6e2;
  --amber:#b47b12; --amber-w:#f8eed6; --blue:#3a6289; --blue-w:#e3ebf3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Pretendard","Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}

/* 상단 */
.top{height:52px;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:20px;height:20px}
.brand small{font-weight:500;color:var(--faint);font-size:11px}
#nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
#nav button{border:0;background:none;padding:7px 11px;border-radius:5px;color:var(--mute);white-space:nowrap;font-size:13.5px}
#nav button:hover{background:var(--head);color:var(--ink)}
#nav button.on{color:var(--acc);font-weight:600;background:var(--acc-w)}
.top .undo{border:1px solid var(--line);background:none;border-radius:5px;padding:5px 9px;font-size:12px;color:var(--mute)}
.top .undo:hover{border-color:var(--line2);color:var(--ink)}
.top .sync{font-size:11px;color:var(--faint);white-space:nowrap;flex:none;max-width:180px;overflow:hidden;text-overflow:ellipsis}
#view{padding:18px 20px 28px;max-width:1560px;margin:0 auto}
.page-head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.page-head h1{font-size:20px;letter-spacing:-.02em}
.page-head .desc{color:var(--mute);font-size:13px}
.page-head .sp{margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.panel>h2{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel>h2 .more{margin-left:auto;font-weight:500;font-size:12px;color:var(--acc);background:none;border:0;padding:0}
.panel>h2 .more:hover{text-decoration:underline}
h3.sub{font-size:12.5px;color:var(--mute);font-weight:600;margin:14px 0 6px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:5px;padding:5px 10px;font-size:13px}
.btn:hover{background:var(--head)}
.btn.danger{color:var(--red)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08);background:var(--acc)}
/* PIN 잠금 */
#lock{position:fixed;inset:0;z-index:55;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
body.locked #lock{display:flex}
body.locked .top,body.locked #view,body.locked #ctx{visibility:hidden}
.lock-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 24px;width:min(320px,100%);text-align:center;box-shadow:0 8px 28px rgba(40,36,28,.08)}
.lock-box svg{width:34px;height:34px;margin-bottom:8px}
.lock-box h1{font-size:17px;margin:0 0 4px}
.lock-box p{color:var(--mute);font-size:12.5px;margin:0 0 16px;line-height:1.5}
.lock-box input{width:100%;box-sizing:border-box;font:inherit;font-size:20px;letter-spacing:.35em;text-align:center;padding:9px;border:1px solid var(--line2);border-radius:6px;margin-bottom:8px;background:var(--panel);color:var(--ink)}
.lock-box input:focus{outline:2px solid var(--acc-w);border-color:var(--acc)}
.lock-box .btn{width:100%;padding:9px;font-size:14px}
.lock-box .err{color:var(--red);font-size:12px;min-height:18px;margin:4px 0 6px}
.lock-box .lnk{background:none;border:0;color:var(--mute);font-size:12px;margin-top:12px;text-decoration:underline;cursor:pointer}
.pin-form{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--mute);max-width:320px}
.pin-form input{font:inherit;padding:5px 8px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);color:var(--ink)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 12px;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--acc)}
.tabs button i{font-style:normal;color:var(--faint);font-size:11px;margin-left:3px}
.hint{color:var(--faint);font-size:12px;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 시트형 표 */
.gridwrap{position:relative;overflow:auto;border:1px solid var(--line2);border-radius:4px;background:var(--panel)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:13px}
.grid th{position:sticky;top:0;z-index:2;background:var(--head);color:#5d594f;font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid td{height:30px;padding:5px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;background:var(--panel);cursor:cell;user-select:none}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid tr:last-child td{border-bottom:0}
.grid td.ro{background:var(--ro);color:#625e55;cursor:default}
.grid td.c,.grid th.c{text-align:center}
.grid td.r,.grid th.r{text-align:right}
.grid td.sel{background:var(--acc-w)}
.grid td.act{box-shadow:inset 0 0 0 2px var(--acc)}
.gridwrap:not(:focus-within) td.act{box-shadow:inset 0 0 0 1px var(--line2)}
.gridwrap:not(:focus-within) td.sel{background:var(--panel)}
.gridwrap:not(:focus-within) td.sel.ro{background:var(--ro)}
.grid td.bad{color:var(--red);font-weight:600}
.grid td.ov{box-shadow:inset 2px 0 0 #c9d8cf}
.grid td.ov.act{box-shadow:inset 0 0 0 2px var(--acc)}
.grid tr.today td{background:#fbf6e6}
.grid tr.today td.sel{background:var(--acc-w)}
.grid tr.daystart td{border-top:1px solid var(--line2)}
.grid tr.subst td.ro{color:var(--faint)}
.grid tr.done td{color:var(--faint)}
.grid tr.done td.strike{text-decoration:line-through}
.grid td.late{background:#efb5a9;color:#5c1d12;font-weight:600}
.grid td.soon{background:#f5dc9c;color:#573c05;font-weight:600}
.grid td.p-hi{background:#a9bfd6;color:#1d3247;font-weight:600}
.grid td.p-mid{background:#d3dfeb}
.grid td.p-lo{background:#edf2f7}
.grid tr.done td.p-hi,.grid tr.done td.p-mid,.grid tr.done td.p-lo{background:var(--panel);color:var(--faint);font-weight:400}
.grid td.as,.grid tr.today td.as{background:var(--red-w);color:#7c2a1c}
.grid td.as.ov{box-shadow:inset 2px 0 0 #c9d8cf}
.grid td.sel.late,.grid td.sel.soon,.grid td.sel.p-hi,.grid td.sel.p-mid,.grid td.sel.p-lo,.grid td.sel.as{filter:brightness(.95)}
.grid th.hd{cursor:pointer}
.grid th.hd:hover{background:#e6e3db;color:var(--ink)}
.icon{border:1px solid var(--line2);background:var(--panel);border-radius:5px;width:28px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon:hover{background:var(--head)}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.quick{display:flex;gap:6px;align-items:center;margin-top:10px}
.quick .qd{flex:none;font-weight:600;font-size:13px;min-width:74px}
.quick input{height:30px;border:1px solid var(--line2);border-radius:5px;padding:0 9px;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);outline:none;min-width:0}
.quick input:focus{border-color:var(--acc)}
.quick #q-title{flex:1}.quick #q-period{width:110px}
.quick .btn{height:30px}
.grid td.neg{color:var(--red)} .grid td.pos{color:var(--blue)} .grid td.ok{color:var(--acc)}
.cb{display:inline-block;width:15px;height:15px;border:1.5px solid var(--line2);border-radius:3px;vertical-align:-3px;background:var(--panel);position:relative}
.cb.on{background:var(--acc);border-color:var(--acc)}
.cb.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.cell-editor{position:absolute;z-index:3;border:2px solid var(--acc);padding:3px 6px;font:inherit;font-size:13px;background:var(--panel);color:var(--ink);outline:none;border-radius:0;margin:0}
.cell-editor.idle{opacity:0;pointer-events:none}
textarea.cell-editor{resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;display:block}
.grid td{white-space:pre-wrap}
#ctx{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:0 6px 20px rgba(40,36,28,.14);padding:4px;display:none;min-width:150px}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:4px;font-size:13px}
#ctx button:hover{background:var(--head)}
#ctx button.danger{color:var(--red)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2925;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
#toast.on{opacity:1}

/* 홈 */
.home{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:16px;height:calc(100vh - 52px - 46px);min-height:560px}
.cal-col{display:flex;flex-direction:column;min-height:0}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-head h1{font-size:24px;letter-spacing:-.03em}
.cal-head h1 span{font-weight:500;color:var(--faint);font-size:15px;margin-left:4px}
.cal-nav{display:flex;gap:4px}
.cal-nav button{border:1px solid var(--line2);background:var(--panel);border-radius:5px;height:28px;min-width:28px;padding:0 8px;font-size:13px}
.cal-nav button:hover{background:var(--head)}
.legend{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot.att{background:#d9a21b}.dot.cns{background:#c4513c}.dot.trn{background:#4a79a8}.dot.nts{background:#6f6a8c}
.grid td.lnk{color:var(--acc);font-weight:600;cursor:pointer}
.grid td.lnk:hover{text-decoration:underline}
.grid th{padding-left:6px;padding-right:4px}
.cal{flex:1;min-height:0;display:grid;grid-template-columns:.55fr repeat(5,1fr) .55fr;grid-auto-rows:minmax(0,1fr);grid-template-rows:26px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.cal .wd{font-size:12px;color:var(--mute);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line2);background:var(--head)}
.cal .wd.sun{color:var(--red)}.cal .wd.sat{color:var(--blue)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px 4px;min-width:0;overflow:hidden;cursor:default;display:flex;flex-direction:column;gap:2px;position:relative}
.cell:nth-child(7n){border-right:0}
.cell.out{background:#faf9f6}.cell.out>*{opacity:.42}
.cell.off{background:#faf9f6}
.cell.subst{background:repeating-linear-gradient(135deg,#fff,#fff 7px,#f6f5f1 7px,#f6f5f1 8px)}
.cell:hover{background-color:#f7f6f1}
.cell.selday{box-shadow:inset 0 0 0 2px var(--acc)}
.cell .n{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;line-height:20px}
.cell .n b{display:inline-block;min-width:20px;height:20px;text-align:center;border-radius:10px;font-weight:600}
.cell.tdy .n b{background:var(--acc);color:#fff;padding:0 4px}
.cell.sun .n b,.cell.hol .n b{color:var(--red)}.cell.sat .n b{color:var(--blue)}
.cell.tdy .n b{color:#fff}
.cell .n em{font-style:normal;font-weight:500;font-size:11px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .n .dots{margin-left:auto;display:flex;gap:3px;align-items:center}
.cell .n .dots .dot{margin:0}
.cell .tt{font-size:11px;color:var(--faint);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.cell .ev{font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px;border-left:2px solid var(--acc);color:#3d3a34}
.cell .ev.as{border-left-color:var(--red);color:var(--red)}
.cell .ev.tr{border-left-color:#4a79a8}
.cell .mo{font-size:11px;color:var(--faint)}
.side{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;min-height:0}
.side .panel{display:flex;flex-direction:column;min-height:0}
.side .panel .gridwrap{flex:1;min-height:0}
.side .stack{display:grid;grid-template-rows:minmax(0,.8fr) minmax(0,1.2fr);gap:12px;min-height:0}
.scroll{overflow:auto;min-height:0;flex:1}
.as-item{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 0;border-bottom:1px solid var(--line)}
.as-item:last-child{border-bottom:0}
.as-item .w{font-size:12px;color:var(--mute)}
.as-item .w b{color:var(--red);font-weight:600;margin-left:4px}
.as-item .t{font-size:13px}
.as-item:hover .t{text-decoration:underline}
.pl{list-style:none;margin:0;padding:0;font-size:13px}
.pl li{display:flex;gap:8px;padding:3px 0;align-items:baseline}
.pl li .k{flex:none;width:18px;color:var(--faint);font-size:12px;text-align:right}
.pl li .s{flex:none;width:58px;font-weight:600}
.pl li .x{color:#55514a;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl li.chk{cursor:pointer}.pl li.chk.done span{color:var(--faint);text-decoration:line-through}
.lbl{font-size:11.5px;color:var(--faint);font-weight:600;margin:10px 0 3px}
.lbl:first-child{margin-top:0}
textarea.memo{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:4px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);background:#fdfcf9;outline:none}
textarea.memo:focus{border-color:var(--acc)}
.empty{color:var(--faint);font-size:13px;padding:4px 0}

/* 날짜 상세 */
.day-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.day-grid aside{display:grid;gap:14px}
.meta{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.three{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px}
.stats div{font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:18px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{font-weight:600;color:var(--mute);font-size:12px;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line2)}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.mini tr:last-child td{border-bottom:0;font-weight:700}
.mini td.neg{color:var(--red)}.mini td.pos{color:var(--blue)}.mini td.ok{color:var(--acc)}
.notes{font-size:13px}
.notes h4{margin:12px 0 4px;font-size:13.5px}
.notes h4 span{font-weight:500;color:var(--faint);font-size:12px;margin-left:6px}
.notes ul{margin:0;padding-left:18px;color:#4d4942}
.cal-col,.side{min-width:0}
.top .undo{white-space:nowrap;flex:none}
@media (max-width:640px){
  .top{gap:10px;padding:0 12px}
  .brand small,.legend{display:none}
  #view{padding:14px 12px 24px}
  .quick{flex-wrap:wrap}
  .quick #q-title{flex:1 1 100%;order:2}
  .quick #q-period{order:3;flex:1}
  .quick .btn{order:4}
}
@media (max-width:1080px){
  .home{grid-template-columns:1fr;height:auto}
  .cal{grid-auto-rows:92px}
  .side{grid-template-columns:1fr}
  .side .panel .gridwrap{max-height:360px}
  .day-grid,.two,.three{grid-template-columns:1fr}
}
</style>
</head>
<body class="locked">
<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <form class="lock-box" id="lockForm" autocomplete="off">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="24" rx="4" fill="#2e5e4e"/><rect x="3" y="5" width="26" height="7" rx="4" fill="#234a3d"/><path d="M10 20.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="lockTitle">Planique</h1>
    <p id="lockMsg">연결 중…</p>
    <input type="password" id="lockPin" inputmode="numeric" maxlength="12" placeholder="PIN" aria-label="PIN" autocomplete="current-password" />
    <input type="password" id="lockPin2" inputmode="numeric" maxlength="12" placeholder="PIN 확인" aria-label="PIN 확인" autocomplete="new-password" hidden />
    <div class="err" id="lockErr" role="alert"></div>
    <button class="btn pri" id="lockGo" type="submit">열기</button>
    <button class="lnk" id="lockMode" type="button">처음 사용: PIN 만들기</button>
  </form>
</div>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="24" rx="4" fill="#2e5e4e"/><rect x="3" y="5" width="26" height="7" rx="4" fill="#234a3d"/><path d="M10 20.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Planique <small id="verTag"></small>
  </div>
  <nav id="nav"></nav>
  <span class="sync" id="syncTag" hidden></span>
  <button class="undo" id="lockBtn" title="PIN 잠금 (30분 동안 사용하지 않으면 자동으로 잠김)">잠그기</button>
  <button class="undo" id="undoBtn" title="Ctrl+Z">되돌리기</button>
</header>
<main id="view"></main>
<div id="ctx"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   Planique 2 — 교사 일정·진도 관리 (초기 모델)
   데이터는 이 브라우저(localStorage)에 먼저 저장되고,
   Firebase(Firestore) appState/planique2 문서에 동기화됩니다 (맨 아래 module 스크립트).
   ============================================================ */

const p2 = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const md = s => { if(!s) return ""; const d = pd(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtMD = s => { if(!s) return ""; const d = pd(s); return `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})`; };

function schoolYear(){ const d = pd(S.set.semStart); return d.getMonth()+1 >= 3 ? d.getFullYear() : d.getFullYear()-1; }
function parseDate(raw){
  raw = String(raw).trim();
  if(raw === "오늘") return TODAY;
  if(raw === "내일") return addDays(TODAY,1);
  let y,m,d, t;
  if((t = raw.match(/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/))){ y=+t[1]; m=+t[2]; d=+t[3]; }
  else if((t = raw.match(/^(\d{1,2})\s*[-./월]\s*(\d{1,2})/))){ m=+t[1]; d=+t[2]; y = m<=2 ? schoolYear()+1 : schoolYear(); }
  else return null;
  const dt = new Date(y,m-1,d);
  return (dt.getMonth() === m-1 && dt.getDate() === d) ? iso(dt) : null;
}

function parseTSV(text){
  text = text.replace(/\r\n?/g,"\n").replace(/\n$/,"");
  if(text === "") return [];
  const rows = [[]]; let cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch === '"' && cur === "") q = true;
    else if(ch === "\t"){ rows[rows.length-1].push(cur); cur = ""; }
    else if(ch === "\n"){ rows[rows.length-1].push(cur); cur = ""; rows.push([]); }
    else cur += ch;

    { label:"과목", w:92, tip:"약어로 입력 (국, 수, 담체 …)", get:r => ttGet(r.date,r.p), fmt:v => subjLabel(v), set:(r,v) => ttSet(r.date,r.p,v), cls:(r,v) => v && !C().abbr.has(v) ? "bad" : "", list:() => S.abbrs.map(a => a.abbr) },

function calHTML(y,m){
  const c = C(), first = new Date(y,m,1), start = new Date(y,m,1-first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y,m+1,0).getDate()) / 7);
  let h = DOW.map((d,i) => `<div class="wd ${i===0?"sun":i===6?"sat":""}">${d}</div>`).join("");
  for(let i = 0; i < weeks*7; i++){
    const dt = new Date(start); dt.setDate(start.getDate()+i);
    const d = iso(dt), w = dt.getDay(), hol = c.hol.get(d), school = c.daySet.has(d);
    const cls = ["cell", dt.getMonth() !== m ? "out" : "", w===0?"sun":w===6?"sat":"", hol?"hol":"", !school?"off":"", school && isSubst(d)?"subst":"", d===TODAY?"tdy":"", d===ui.sel?"selday":""].join(" ");
    const dots = (c.att.has(d) ? `<i class="dot att" title="출결 ${c.att.get(d).length}건"></i>` : "") + (c.cns.has(d) ? `<i class="dot cns" title="상담 ${c.cns.get(d).length}건"></i>` : "") + (c.nts.has(d) ? `<i class="dot nts" title="특이사항 ${c.nts.get(d).length}건"></i>` : "") + (c.trn.has(d) ? `<i class="dot trn" title="컨설팅·연수"></i>` : "");
    const tt = (S.tt[d] || []).filter(x => x).join(" ");
    const lines = [];
    for(let p = 1; p <= NP; p++){ const a = ttGet(d,p) && d >= TODAY ? progGet(d,p,"assess") : ""; if(a) lines.push(`<div class="ev as">${esc(a.replace(/^수행평가:\s*/,"수행 · "))}</div>`); }
    eventsOn(d).forEach(e => lines.push(`<div class="ev">${esc(e.title)}</div>`));
    (c.trn.get(d) || []).forEach(t => { if(t.title) lines.push(`<div class="ev tr">${esc(t.title)}</div>`); });
    const max = weeks > 5 ? 2 : 3, shown = lines.slice(0,max).join("") + (lines.length > max ? `<div class="mo">+${lines.length-max}</div>` : "");
    h += `<div class="${cls}" data-d="${d}"><div class="n"><b>${dt.getDate()}</b>${hol ? `<em>${esc(hol)}</em>` : ""}<span class="dots">${dots}</span></div>${tt ? `<div class="tt">${esc(tt)}</div>` : ""}${shown}</div>`;
  }
  return h;
}
function dayPanel(){
  const d = ui.sel, c = C(), isToday = d === TODAY;
  $("#dp-title").innerHTML = `${isToday ? "오늘 할 일" : fmtMD(d) + " 할 일"} <button class="more" id="dp-open">자세히</button>`;
  $("#dp-open").onclick = () => openDay(d);
  $("#q-date").textContent = fmtMD(d);
  let h = "";
  const per = []; for(let p = 1; p <= NP; p++){ const ab = ttGet(d,p); if(ab) per.push(`<li><span class="k">${p}</span><span class="s">${esc(subjLabel(ab))}</span><span class="x">${esc(progGet(d,p,"content"))}</span></li>`); }
  if(per.length) h += `<div class="lbl">수업</div><ul class="pl">${per.join("")}</ul>`;
  else if(c.daySet.has(d)) h += `<div class="lbl">수업</div><div class="empty">시간표를 아직 넣지 않았습니다.</div>`;
  const todos = S.todos.filter(t => t.title && ((t.daily && isToday) || (!t.daily && t.due === d)));
  if(todos.length) h += `<div class="lbl">챙길 일</div><ul class="pl">${todos.map(t => `<li class="chk${isDone(t) ? " done" : ""}" data-id="${t.id}"><i class="cb${isDone(t) ? " on" : ""}"></i><span>${esc(t.title)}</span></li>`).join("")}</ul>`;
  const evs = [...eventsOn(d).map(e => e.title + (e.period ? ` · ${e.period}` : "")), ...(c.trn.get(d) || []).map(t => `${t.kind || "연수"} · ${t.title}${t.org ? ` (${t.org})` : ""}`)];
  if(evs.length) h += `<div class="lbl">일정</div><ul class="pl">${evs.map(e => `<li><span>${esc(e)}</span></li>`).join("")}</ul>`;
  const st = [...(c.att.get(d) || []).map(a => `<li><i class="dot att"></i><span>${esc(a.no)}번 ${esc(stuName(a.no))} ${esc(a.type || "")} ${esc(a.memo || "")}</span></li>`), ...(c.cns.get(d) || []).map(a => `<li><i class="dot cns"></i><span>${esc(a.no)}번 ${esc(stuName(a.no))} 상담 · ${esc(a.topic || "")}</span></li>`), ...(c.nts.get(d) || []).map(a => `<li><i class="dot nts"></i><span>${esc(a.no)}번 ${esc(stuName(a.no))} ${esc(a.cat || "특이사항")} · ${esc(a.content || "")}</span></li>`)];
  if(st.length) h += `<div class="lbl">학생</div><ul class="pl">${st.join("")}</ul>`;
  h += `<div class="lbl">하루 메모</div><textarea class="memo" id="dp-memo" placeholder="할 일과 별개로, 그날 적어 둘 것">${esc(S.dayMemos[d] || "")}</textarea>`;
  const el = $("#dp"); el.innerHTML = h;
  el.onclick = e => { const li = e.target.closest("li.chk"); if(!li) return; const t = S.todos.find(t => t.id === li.dataset.id); if(t) mut(() => colDone.set(t, !isDone(t))); };
  bindMemo($("#dp-memo"), d);
}

/* ----- 시간표 ----- */
function monthsOfTerm(){ const out = [], seen = new Set(); C().days.forEach(d => { const k = d.slice(0,7); if(!seen.has(k)){ seen.add(k); out.push(k); } }); return out; }
function monthTabs(cur, extra){
  return `<div class="tabs" id="mtabs">${(extra || []).map(([k,l]) => `<button data-k="${k}" class="${cur === k ? "on" : ""}">${l}</button>`).join("")}${monthsOfTerm().map(k => `<button data-k="${k}" class="${cur === k ? "on" : ""}">${+k.slice(5)}월</button>`).join("")}</div>`;
}
function miniHours(){
  const { rows, T } = hoursTable(), sg = n => n === 0 ? "ok" : n < 0 ? "neg" : "pos", f = n => n > 0 ? "+"+n : n;
  return `<table class="mini"><thead><tr><th>과목</th><th>남은</th><th>넣은</th><th>과부족</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.s.name)}</td><td>${r.remain}</td><td>${r.planned}</td><td class="${sg(r.diff)}">${f(r.diff)}</td></tr>`).join("")}<tr><td>합계</td><td>${T.remain}</td><td>${T.planned}</td><td class="${sg(T.diff)}">${f(T.diff)}</td></tr></tbody></table>`;
}

  const c = C(), months = monthsOfTerm();

  new Grid($("#g-tt"), { id:"tt", maxH:Math.max(320, innerHeight-250), rows:() => days.map(d => ({ date:d })),
    rowCls:r => [r.date === TODAY ? "today" : "", isSubst(r.date) ? "subst" : "", pd(r.date).getDay() === 1 ? "daystart" : ""].join(" "),

function pgLessons(){
  const c = C();
  if(!c.abbr.has(ui.lessonAbbr)) ui.lessonAbbr = S.abbrs[0] ? S.abbrs[0].abbr : "";
  const ab = ui.lessonAbbr, list = S.lessons[ab] || (S.lessons[ab] = []);
  let used = 0; list.forEach(l => { if(c.assign.has(l)) used++; });
  const subj = c.abbr.get(ab), h = hoursTable().rows.find(r => r.s.name === subj);
  V().innerHTML = `<div class="page-head"><h1>차시 목록</h1><span class="desc">위에서부터 차례로 수업에 배정됩니다 (${md(S.set.planStart)} 수업부터). 줄을 넣거나 빼거나 순서를 바꾸면 진도가 따라 바뀝니다.</span></div>
    <div class="tabs" id="ltabs">${S.abbrs.filter(a => a.abbr).map(a => `<button data-k="${esc(a.abbr)}" class="${a.abbr === ab ? "on" : ""}">${esc(a.abbr)}<i>${(S.lessons[a.abbr] || []).length || ""}</i></button>`).join("")}</div>

      <span class="meta sp" style="margin-left:auto">${esc(subj || "")} · 목록 ${list.length}차시 중 ${used}차시 배정${h ? ` · 남은 시수 ${h.remain}` : ""}</span>
    </div>
    <div id="g-les"></div>
    <p class="hint">구글 시트 '차시 목록' 탭에서 약어~비고 열(A:G)을 복사해 여기에 붙여넣으면 과목별로 한꺼번에 들어옵니다. 우클릭으로도 행을 추가·삭제할 수 있습니다.</p>`;
  $("#ltabs").onclick = e => { const b = e.target.closest("button"); if(b){ ui.lessonAbbr = b.dataset.k; delete gridSel.les; delete gridScroll.les; render(); } };
  const mk = () => ({ unit:"", content:"", pages:"", assess:"", note:"" });
  const g = new Grid($("#g-les"), { id:"les", maxH:Math.max(320, innerHeight-290), ...src(list,mk),
    rowCls:l => c.assign.has(l) && c.assign.get(l).date < TODAY ? "done" : "",
    paste:m => {
      if(!(m.length && m.every(r => r.length >= 4 && c.abbr.has(r[0].trim()) && /^\d*$/.test(r[1].trim())))) return false;
      const by = {}; m.forEach(r => (by[r[0].trim()] = by[r[0].trim()] || []).push({ unit:(r[2]||"").trim(), content:(r[3]||"").trim(), pages:(r[4]||"").trim(), assess:(r[5]||"").trim(), note:(r[6]||"").trim() }));
      const names = Object.keys(by);
      if(confirm(`${names.join(", ")} 과목의 차시 목록을 붙여넣은 ${m.length}줄로 바꿀까요?`)) names.forEach(a => S.lessons[a] = by[a]);
      return true;
    },
    cols:[ { label:"순번", w:46, type:"ro", al:"c", get:l => list.indexOf(l)+1 }, { key:"unit", label:"단원", w:220 }, { key:"content", label:"학습 내용" }, { key:"pages", label:"교과서 쪽수", w:90 }, { key:"assess", label:"평가", w:230, cls:(l,v) => v ? "as" : "" }, { key:"note", label:"비고", w:190 },

/* 기존 Planique(1.x) 자료에서 명단·출결·상담만 가져오기. 이미 있는 기록은 건너뜀 */
function importOld(obj){
  const st = obj && obj._meta && obj.state ? obj.state : obj;
  if(!st || !Array.isArray(st.students)){ toast("기존 Planique 백업 파일이 아닙니다"); return; }
  const byId = new Map(st.students.map(s => [s.id, s])), no = s => String(s.no ?? ""), n = [0,0,0,0];
  const has = (arr,o) => arr.some(x => Object.keys(o).every(k => String(x[k] ?? "") === String(o[k] ?? "")));
  mut(() => {
    st.students.slice().sort((a,b) => (Number(a.no) || 0) - (Number(b.no) || 0)).forEach(s => {
      const memo = [s.gender, s.phone, s.parentPhone && "보호자 " + s.parentPhone, s.address].filter(Boolean).join(" · ");
      const cur = S.students.find(x => no(s) !== "" ? String(x.no) === no(s) : x.name === s.name);
      if(cur){ if(!cur.name && s.name){ cur.name = s.name; n[0]++; } if(!cur.memo && memo) cur.memo = memo; }
      else { S.students.push({ no:no(s), name:s.name || "", memo }); n[0]++; }
    });
    Object.keys(st.attendance || {}).sort().forEach(date => {
      const day = st.attendance[date] || {};
      Object.keys(day).forEach(id => {
        const r = day[id], s = byId.get(id);
        if(!r || !s || !r.status || r.status === "출석") return;
        const per = Array.isArray(r.periods) && r.periods.length ? r.periods.slice().sort((a,b) => a-b).join("·") + "교시" : "";
        const o = { date, no:no(s), type:r.status, memo:[r.subType, per, r.note].filter(Boolean).join(" ") };
        if(!has(S.attendance,o)){ S.attendance.push(o); n[1]++; }
      });
    });
    (st.counseling || []).slice().sort((a,b) => (a.date || "") < (b.date || "") ? -1 : 1).forEach(c => {
      const s = byId.get(c.studentId); if(!s) return;
      if(c.category === "특이사항"){ const o = { date:c.date || "", no:no(s), cat:"", content:[c.title, c.content].filter(Boolean).join(" — ") }; if(!has(S.notes,o)){ S.notes.push(o); n[3]++; } return; }
      const topic = c.title ? (c.category && c.category !== "상담" ? `[${c.category}] ` : "") + c.title : (c.category || "");
      const o = { date:c.date || "", no:no(s), topic, content:c.content || "" };
      if(!has(S.counsels,o)){ S.counsels.push(o); n[2]++; }
    });
  });
  toast(`명단 ${n[0]}명 · 출결 ${n[1]}건 · 상담 ${n[2]}건 · 특이사항 ${n[3]}건을 가져왔습니다`);
}

<!-- Firebase: PIN 잠금(Authentication) + 실시간 동기화(Firestore) -->
<script type="module">
/* ============================================================
   Planique 2 — PIN 잠금 + Firebase(Firestore) 실시간 동기화
   - PIN = Firebase Authentication(이메일/비밀번호) 계정의 비밀번호.
     PIN을 맞혀야 Firestore를 읽고 쓸 수 있음 (보안 규칙으로 막음)
   - 2.0 자료: appState/planique2  (1.x 자료 appState/main 은 건드리지 않음)
   - 고칠 때마다 0.8초 뒤 저장, 다른 기기에서 바뀌면 바로 반영
   - 처음 열 때는 클라우드와 이 기기 중 더 최근에 고친 쪽을 사용
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
import { getAuth, setPersistence, browserSessionPersistence, onAuthStateChanged,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
  updatePassword, reauthenticateWithCredential, EmailAuthProvider }
  from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCdTjHlJr0Kw02J07BYLtzbMonW2Ldb6UY",
  authDomain: "planique-prv.firebaseapp.com",
  projectId: "planique-prv",
  storageBucket: "planique-prv.firebasestorage.app",
  messagingSenderId: "771729613462",
  appId: "1:771729613462:web:8a3f7d74954256fa6e98b7"
};
const OWNER = "owner@planique-prv.firebaseapp.com"; // PIN 계정 (실제 메일은 오가지 않음)
const IDLE_MIN = 30;                                 // 이 시간 동안 조작이 없으면 자동 잠금

const P = window.Planique;
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const ref = doc(db, "appState", "planique2");
const OLD_REF = doc(db, "appState", "main");
const LOCAL_AT = "planique2-localAt";   // 이 기기에서 마지막으로 고친 시각
const MAX_LEN = 900000;                 // Firestore 문서 한도(1MiB)보다 조금 작게
const CLIENT = Math.random().toString(36).slice(2, 10);

let ready = false, timer = null, pending = null, lastSent = null, unsub = null, statusText = "잠김";
const localAt = () => Number(localStorage.getItem(LOCAL_AT)) || 0;
const markLocal = t => { try { localStorage.setItem(LOCAL_AT, String(t)); } catch (e) {} };
const time = () => new Date().toLocaleTimeString();
const $ = id => document.getElementById(id);
function setStatus(short, long) {
  statusText = long || short;
  const tag = $("syncTag");
  if (tag) { tag.hidden = !short; tag.textContent = short; tag.title = statusText; }
  const el = $("fbStatus");
  if (el) el.textContent = statusText;
}
const ERR = {
  "auth/invalid-credential": "PIN이 맞지 않습니다",
  "auth/wrong-password": "PIN이 맞지 않습니다",
  "auth/user-not-found": "아직 PIN이 없습니다. 아래 'PIN 만들기'를 누르세요",
  "auth/too-many-requests": "여러 번 틀려서 잠시 막혔습니다. 몇 분 뒤 다시 시도하세요",
  "auth/network-request-failed": "인터넷 연결을 확인하세요",
  "auth/email-already-in-use": "이미 PIN이 있습니다. 'PIN 입력'으로 돌아가 여세요",
  "auth/operation-not-allowed": "Firebase 콘솔에서 이메일/비밀번호 로그인을 켜야 합니다",
  "auth/configuration-not-found": "Firebase 콘솔에서 Authentication을 시작하고 이메일/비밀번호 로그인을 켜야 합니다",
  "auth/admin-restricted-operation": "새 PIN 만들기가 막혀 있습니다 (이미 설정됨)",
  "auth/requires-recent-login": "다시 잠금 해제한 뒤 바꿔 주세요",
};
const errMsg = e => ERR[e && e.code] || ("오류: " + ((e && (e.code || e.message)) || "알 수 없음"));

/* ---------------- 잠금 화면 ---------------- */
let creating = false, busy = false;
const locked = () => document.body.classList.contains("locked");
function showLock(msg) {
  document.body.classList.add("locked");
  creating = false; drawLock(msg);
}
function drawLock(msg) {
  $("lockMsg").textContent = msg || (creating ? "처음 사용할 PIN(숫자 6~12자리)을 정하세요." : "PIN을 입력하세요.");
  $("lockPin2").hidden = !creating;
  $("lockGo").textContent = creating ? "PIN 만들기" : "열기";
  $("lockMode").textContent = creating ? "PIN 입력으로 돌아가기" : "처음 사용: PIN 만들기";
  $("lockErr").textContent = "";
  $("lockPin").value = ""; $("lockPin2").value = "";
  setTimeout(() => $("lockPin").focus(), 30);
}
$("lockMode").onclick = () => { creating = !creating; drawLock(); };
$("lockForm").onsubmit = async e => {
  e.preventDefault();
  if (busy) return;
  const pin = $("lockPin").value.trim(), err = $("lockErr");
  if (!/^\d{6,12}$/.test(pin)) { err.textContent = "숫자 6~12자리를 입력하세요"; return; }
  if (creating && pin !== $("lockPin2").value.trim()) { err.textContent = "PIN 확인이 일치하지 않습니다"; return; }
  busy = true; $("lockGo").disabled = true; err.textContent = "";
  try {
    if (creating) await createUserWithEmailAndPassword(auth, OWNER, pin);
    else await signInWithEmailAndPassword(auth, OWNER, pin);
  } catch (ex) {
    err.textContent = errMsg(ex); $("lockPin").select();
  } finally { busy = false; $("lockGo").disabled = false; }
};
// 잠겨 있는 동안에는 뒤에 숨은 앱으로 키 입력·붙여넣기가 가지 않게 막음
for (const t of ["keydown", "keypress", "paste", "copy", "cut"])
  document.addEventListener(t, e => { if (locked() && !e.target.closest("#lock")) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);

$("lockBtn").onclick = () => lock();
async function lock(msg) {
  await flush();
  stopSync();
  await signOut(auth).catch(() => {});
  showLock(msg);
}
// 일정 시간 조작이 없으면 자동 잠금
let lastAct = Date.now();
for (const t of ["pointerdown", "keydown", "wheel", "touchstart"]) addEventListener(t, () => { lastAct = Date.now(); }, { passive: true, capture: true });
setInterval(() => { if (!locked() && auth.currentUser && Date.now() - lastAct > IDLE_MIN * 60000) lock(`${IDLE_MIN}분 동안 사용하지 않아 잠갔습니다. PIN을 입력하세요.`); }, 30000);

/* ---------------- 저장·동기화 ---------------- */
async function flush() {
  clearTimeout(timer);
  if (!ready || pending == null) return;
  const json = pending; pending = null;
  if (json.length > MAX_LEN) { setStatus("저장 실패", "자료가 너무 커서 클라우드에 저장하지 못했습니다"); P.toast("자료가 너무 커서 클라우드에 저장하지 못했습니다. 백업 파일로 저장해 주세요."); return; }
  const at = Date.now();
  lastSent = json;
  try {
    await setDoc(ref, { data: json, updatedAt: at, client: CLIENT, ver: P.version });
    markLocal(at);
    setStatus("저장됨", "Firestore 연결됨 · 최근 저장 " + time());
  } catch (e) {
    console.error("Firestore 저장 실패", e);
    setStatus("저장 실패", "Firestore 저장 실패: " + (e.code || e.message) + " (보안 규칙 확인 필요)");
    P.toast("클라우드에 저장하지 못했습니다 (" + (e.code || "오류") + ")");
  }
}

window.PlaniqueCloud = {
  // app.js의 save()가 부를 때마다 호출됨
  push(json) {
    markLocal(Date.now());
    pending = json;
    if (!ready) return;
    setStatus("저장 중…");
    clearTimeout(timer);
    timer = setTimeout(flush, 800);
  },
  status: () => statusText,
  async reload() {
    if (!ready) { P.toast("잠금을 해제한 뒤 사용하세요"); return; }
    try {
      const s = await getDoc(ref);
      if (!s.exists() || !s.data().data) { P.toast("클라우드에 저장된 자료가 없습니다"); return; }
      const d = s.data();
      pending = null; lastSent = d.data; markLocal(d.updatedAt || Date.now());
      P.apply(d.data); P.toast("클라우드에서 다시 불러왔습니다 (Ctrl+Z로 되돌리기)");
      setStatus("저장됨", "Firestore 연결됨 · 다시 불러옴 " + time());
    } catch (e) { P.toast("불러오기 실패: " + (e.code || e.message)); }
  },
  // Planique 1.x 자료 (appState/main) — 학생 > 기존 Planique에서 가져오기
  async loadOld() {
    const s = await getDoc(OLD_REF);
    if (!s.exists() || !s.data().data) return null;
    return JSON.parse(s.data().data);
  },
  async changePin(cur, next) {
    const u = auth.currentUser;
    if (!u) return "잠금을 해제한 뒤 바꿔 주세요";
    try {
      await reauthenticateWithCredential(u, EmailAuthProvider.credential(OWNER, cur));
      await updatePassword(u, next);
      return "PIN을 바꿨습니다. 다른 기기에서는 새 PIN으로 여세요";
    } catch (e) { return e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" ? "현재 PIN이 맞지 않습니다" : errMsg(e); }
  },
};
window.addEventListener("beforeunload", () => { if (pending != null) flush(); });
// 핸드폰(설치형 앱)은 닫을 때 beforeunload가 오지 않는 경우가 많음 → 화면을 내릴 때 바로 저장
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && pending != null) flush(); });

async function startSync() {
  setStatus("연결 중…", "Firestore 연결 중…");
  try {
    const snap = await getDoc(ref);
    const remote = snap.exists() ? snap.data() : null;
    ready = true;
    if (remote && remote.data && (remote.updatedAt || 0) >= localAt()) {
      // 클라우드 자료가 더 최근 → 받아오기
      pending = null;
      if (remote.data !== P.getJSON()) P.apply(remote.data);
      lastSent = remote.data; markLocal(remote.updatedAt || Date.now());
      setStatus("저장됨", "Firestore 연결됨 · 동기화 완료");
    } else {
      // 클라우드가 비어 있거나 이 기기 자료가 더 최근 → 올리기
      pending = P.getJSON(); await flush();
      if (remote) P.toast("이 기기의 최근 자료를 클라우드에 올렸습니다");
    }
  } catch (e) {
    console.error("Firestore 연결 실패", e);
    setStatus("연결 실패", "Firestore 연결 실패: " + (e.code || e.message) + " (보안 규칙 확인 필요) · 이 브라우저에는 계속 저장됩니다");
    return;
  }
  // 다른 기기에서 바뀐 내용 실시간 반영
  unsub = onSnapshot(ref, s => {
    if (s.metadata.hasPendingWrites || !s.exists()) return;
    const d = s.data();
    if (!d.data || d.client === CLIENT || d.data === lastSent) return;
    if (pending != null) return; // 이 기기에서 고치는 중이면 이 기기 것을 우선
    lastSent = d.data; markLocal(d.updatedAt || Date.now());
    if (P.apply(d.data)) { setStatus("저장됨", "Firestore 연결됨 · 다른 기기 변경 반영 " + time()); P.toast("다른 기기에서 바뀐 내용을 반영했습니다"); }
  }, e => {
    console.error("Firestore 리스너 오류", e);
    setStatus("연결 오류", "Firestore 오류: " + (e.code || e.message) + " (보안 규칙 확인 필요)");
  });
}
function stopSync() {
  if (unsub) { unsub(); unsub = null; }
  ready = false; clearTimeout(timer);
  setStatus("");
}

/* ---------------- 시작 ---------------- */
// 브라우저(탭)를 닫으면 로그인도 사라짐 → 다시 열 때 PIN 필요
setPersistence(auth, browserSessionPersistence).catch(() => {}).finally(() => {
  onAuthStateChanged(auth, u => {
    if (u && u.email === OWNER) {
      document.body.classList.remove("locked");
      lastAct = Date.now();
      P.refresh();
      startSync();
    } else {
      stopSync();
      showLock();
    }
  });
});
</script>
